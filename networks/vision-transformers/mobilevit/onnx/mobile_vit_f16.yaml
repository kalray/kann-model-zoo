name: mobilevit-small-256
framework: onnx
onnx_model: Kalray/mobile-vit/mobilevit-small-256-256.onnx

input_nodes_name:
    - images
input_nodes_shape:
    - [256, 1, 256, 3]
input_nodes_dtype:
    - "float32"
output_nodes_name:
    - "output_0"
output_nodes_shape:
    - [1, 1000]
output_nodes_dtype:
    - "float32"

generate_options:
    threshold_image_to_ddr: 50000000
    ddr_images_tiles_size: 65535

extra_data:
    classes: classes.txt
    input_preparators:
        - input_preparator.py
    output_preparator: output_preparator
