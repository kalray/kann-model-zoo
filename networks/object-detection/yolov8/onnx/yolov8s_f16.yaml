name: YOLOv8s
framework: onnx
onnx_model: Kalray/yolov8/yolov8s.onnx

input_nodes_name:
    - images
input_nodes_shape:
    - [640, 1, 640, 3]
output_nodes_name:
    - "predictions"
output_nodes_shape:
    - [1, 84, 8400]

generate_options:
    threshold_image_to_ddr: 50000000
    threshold_max_params_size: 450000
    ddr_images_tiles_size: 65535

extra_data:
    classes: classes.txt
    input_preparators:
        - input_preparator.py
    output_preparator: output_preparator
