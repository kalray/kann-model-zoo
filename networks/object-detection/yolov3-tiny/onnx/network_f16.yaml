name: YOLOv3-tiny
onnx_model: models/yolov3-tiny.onnx
framework: onnx
onnx_graph_optim: true

input_nodes_name:
    - images
input_nodes_shape:
    - [416, 1, 416, 3]
output_nodes_name:
    - Conv_output_0
    - Conv_output_1
output_nodes_shape:
    - [26, 1, 26, 255]
    - [13, 1, 13, 255]

generate_options:
    quantize_fp32_to_fp16: true
    ddr_images_tiles_size: 65535


extra_data:
    classes: classes.txt
    input_preparators:
        - input_preparator.py
    output_preparator: output_preparator
