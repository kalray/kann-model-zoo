framework: onnx
name: SSD-ResNet34-MLPerf
onnx_model: Kalray/ssd-resnet34-mlperf/ssd-resnet34.optimized.onnx
onnx_graph_optim: true

input_nodes_name:
    - image
input_nodes_shape:
    - [1200, 1, 1200, 3]

output_nodes_name:
    - Concat_659
    - Transpose_661
output_nodes_shape:
    - [1, 15130, 4    ]
    - [1, 81,    15130]


generate_options:
    threshold_image_to_ddr: 7000000
    threshold_max_params_size: 500000
    ddr_images_tiles_size: 65535

extra_data:
    classes: classes.txt
    input_preparators:
        - input_preparator.py
    output_preparator: output_preparator
