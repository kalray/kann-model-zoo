name: deeplabv3plus_mobilenetv2
framework: onnx
onnx_model: Kalray/deeplabv3plus-mobilenetv2/deeplab-mb2_bilinear.onnx
onnx_graph_optim: true

input_nodes_name:
    - MobilenetV2/MobilenetV2/input:0
input_nodes_shape:
    - [513, 1, 513, 3]
input_nodes_dtype:
    - float32

output_nodes_name:
    - ResizeBilinear_2:0
output_nodes_shape:
    - [520, 1, 520, 21]
output_nodes_dtype:
    - float32

generate_options:
    threshold_image_to_ddr: 10000000
    threshold_max_params_size: 500000
    ddr_images_tiles_size: 65535

extra_data:
    classes: classes.txt
    input_preparators:
        - input_preparator.py
    output_preparator: output_preparator
