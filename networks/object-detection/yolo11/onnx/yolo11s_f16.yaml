name: YOLO11s
framework: onnx
onnx_model: Kalray/yolo11/yolo11s.onnx
onnx_graph_optim: true

input_nodes_name:
    - "images"
input_nodes_shape:
    - [640, 1, 640, 3]
input_nodes_dtype:
    - "float32"

output_nodes_name:
    - "predictions"
output_nodes_shape:
    - [1, 84, 8400]
output_nodes_dtype:
    - "float32"

generate_options:
    quantize_fp32_to_fp16: true
    threshold_image_to_ddr: 50000000
    ddr_images_tiles_size: 65535

extra_data:
    classes: classes.txt
    input_preparators:
        - input_preparator.py
    output_preparator: output_preparator