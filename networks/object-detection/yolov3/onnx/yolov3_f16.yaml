name: YOLOv3
framework: onnx
onnx_model: Kalray/yolov3/yolov3.onnx
onnx_graph_optim: true

input_nodes_name:
    - images
input_nodes_shape:
    - [416, 1, 416, 3]
output_nodes_name:
    - predictions
output_nodes_shape:
    - [1, 10647, 85]

generate_options:
    threshold_image_to_ddr: 100000000
    threshold_max_params_size: 500000
    ddr_images_tiles_size: 65535

extra_data:
    classes: classes.txt
    input_preparators:
        - input_preparator.py
    output_preparator: output_preparator