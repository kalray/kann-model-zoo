name: yolov8s-relu
framework: onnx
onnx_model: models/yolov8s-relu-s.optimized.onnx
onnx_graph_optim: true

input_nodes_name:
    - "images"
input_nodes_shape:
    - [640, 1, 640, 3]
input_nodes_dtype:
    - "float32"

output_nodes_name:
    - "/model.22/Concat_output_0"
    - "/model.22/Concat_1_output_0"
    - "/model.22/Concat_2_output_0"
output_nodes_shape:
    - [80, 1, 80, 144 ]
    - [40, 1, 40, 144]
    - [20, 1, 20, 144]
output_nodes_dtype:
    - "float32"
    - "float32"
    - "float32"

generate_options:
    quantize_fp32_to_fp16: true
    threshold_image_to_ddr: 10000000
    threshold_max_params_size: 500000
    ddr_images_tiles_size: 65535

extra_data:
    classes: classes.txt
    input_preparators:
        - input_preparator.py
    output_preparator: output_preparator
