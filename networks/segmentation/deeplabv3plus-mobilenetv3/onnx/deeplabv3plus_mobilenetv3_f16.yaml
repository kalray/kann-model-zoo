name: deeplabv3plus_mobilenetv3-large
framework: onnx
onnx_model: models/deeplabv3plus-mobilenetv3-s.onnx
onnx_graph_optim: true

input_nodes_name:
    - images
input_nodes_shape:
    - [513, 1, 513, 3]
input_nodes_dtype:
    - "float32"

output_nodes_name:
    - output
output_nodes_dtype:
    - "float32"
output_nodes_shape:
    - [513, 1, 513, 21]

generate_options:
    data_buffer_size: 7560000
    threshold_image_to_ddr: 1000000
    threshold_max_params_size: 500000
    ddr_images_tiles_size: 65535

extra_data:
    classes: classes.txt
    input_preparators:
        - input_preparator.py
    output_preparator: output_preparator
