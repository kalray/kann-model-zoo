name: YOLOv4
framework: onnx
onnx_model: Kalray/yolov4/yolov4.optimized.onnx
onnx_graph_optim: true

input_nodes_name:
    - images
input_nodes_shape:
    - [640, 1, 640, 3]

output_nodes_name:
    - /module_list.160/Conv2d/Conv_output_0
    - /module_list.149/Conv2d/Conv_output_0
    - /module_list.138/Conv2d/Conv_output_0
output_nodes_shape:
    - [20, 1, 20, 255]
    - [40, 1, 40, 255]
    - [80, 1, 80, 255]

generate_options:
    data_buffer_size: 7560000
    threshold_image_to_ddr: 13000000
    ddr_images_tiles_size: 65535

extra_data:
    classes: classes.txt
    input_preparators:
        - input_preparator.py
    output_preparator: output_preparator
