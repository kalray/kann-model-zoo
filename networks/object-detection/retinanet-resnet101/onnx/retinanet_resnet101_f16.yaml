name: RetinaNet-R101-FPN
framework: onnx
onnx_model: Kalray/retinanet-resnet101/retinanet-resnet101-fpn-512.onnx
onnx_graph_optim: true

input_nodes_name:
    - input
input_nodes_shape:
    - [512, 1, 512, 3]

output_nodes_name:
    - output1
    - output2
    - output3
    - output4
    - output5
    - output6
    - output7
    - output8
    - output9
    - output10
output_nodes_shape:
    - [ 64, 1, 64, 720]
    - [ 32, 1, 32, 720]
    - [ 16, 1, 16, 720]
    - [  8, 1,  8, 720]
    - [  4, 1,  4, 720]
    - [ 64, 1, 64,  36]
    - [ 32, 1, 32,  36]
    - [ 16, 1, 16,  36]
    - [  8, 1,  8,  36]
    - [  4, 1,  4,  36]

generate_options:
    threshold_image_to_ddr: 10000000
    threshold_max_params_size: 500000
    ddr_images_tiles_size: 65535

extra_data:
    classes: classes.txt
    input_preparators:
        - input_preparator.py
    output_preparator: output_preparator
