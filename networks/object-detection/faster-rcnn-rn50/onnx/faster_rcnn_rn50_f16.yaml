name: FasterRCNN-Resnet50
framework: onnx
onnx_model: Kalray/faster-rcnn-rn50/FasterRCNN-10.optimized.onnx
onnx_graph_optim: true

input_nodes_name:
    - image
input_nodes_shape:
    - [512, 1, 512, 3]
output_nodes_name:
    - 495
    - 498
    - 501
    - 502
    - 509
    - 510
    - 513
    - 514
output_nodes_shape:
    - [ 128, 1, 128, 3]
    - [ 128, 1, 128, 12]
    - [  64, 1,  64, 3]
    - [  64, 1,  64, 12]
    - [  16, 1,  16, 3]
    - [  16, 1,  16, 12]
    - [  8,  1,   8, 3]
    - [  8,  1,   8, 12]

generate_options:
    threshold_image_to_ddr: 10000000
    threshold_max_params_size: 500000
    ddr_images_tiles_size: 65535

extra_data:
    classes: classes.txt
    input_preparators:
        - input_preparator.py
    output_preparator: output_preparator
