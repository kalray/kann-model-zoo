name: YOLOv7-tiny
framework: onnx
onnx_model: Kalray/yolov7/yolov7-tiny.onnx
onnx_graph_optim: true

input_nodes_name:
    - images
input_nodes_shape:
    - [640, 1, 640, 3]
input_nodes_dtype:
    - float32

output_nodes_name:
    - output
output_nodes_shape:
    - [1, 25200, 85]
output_nodes_dtype:
    - float32

generate_options:
    threshold_image_to_ddr: 100000000
    threshold_max_params_size: 500000
    ddr_images_tiles_size: 65535

extra_data:
    classes: classes.txt
    input_preparators:
        - input_preparator.py
    output_preparator: output_preparator
