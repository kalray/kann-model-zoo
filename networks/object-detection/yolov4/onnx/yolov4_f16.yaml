name: YOLOv4
framework: onnx
onnx_model: Kalray/yolov4/yolov4.onnx
onnx_graph_optim: true

input_nodes_name:
    - images
input_nodes_shape:
    - [640, 1, 640, 3]
output_nodes_name:
    - predictions
output_nodes_shape:
    - [1, 25200, 85]

generate_options:
    data_buffer_size: 7560000
    threshold_image_to_ddr: 13000000
    ddr_images_tiles_size: 65535

extra_data:
    classes: classes.txt
    input_preparators:
        - input_preparator.py
    output_preparator: output_preparator
