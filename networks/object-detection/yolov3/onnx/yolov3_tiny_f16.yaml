name: YOLOv3-tiny
onnx_model: Kalray/yolov3/yolov3-tiny.onnx
framework: onnx
onnx_graph_optim: true

input_nodes_name:
    - images
input_nodes_shape:
    - [416, 1, 416, 3]
output_nodes_name:
    - predictions
output_nodes_shape:
    - [1, 2535, 85]

generate_options:
    ddr_images_tiles_size: 65535

extra_data:
    classes: classes.txt
    input_preparators:
        - input_preparator.py
    output_preparator: output_preparator
